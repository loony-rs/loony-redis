[workspace]
resolver = "2"
members = [".", "crates/protocol", "crates/storage", "crates/server", "crates/persistence"]

[package]
name = "loony-redis"
version = "0.1.0"
edition = "2021"

[lib]
name = "loony_redis"
path = "src/lib.rs"

[[bin]]
name = "loony-redis"
path = "src/main.rs"

[[bench]]
name = "throughput"
harness = false

[dependencies]
tokio = { version = "1", features = ["full"] }
dashmap = "6"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
protocol = { path = "crates/protocol" }
storage = { path = "crates/storage" }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
