[package]
name = "loony-redis"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "loony-redis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
dashmap = "6"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
